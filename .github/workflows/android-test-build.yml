name: Mobile checks and manual Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      buildAndroid:
        description: Build an Android test APK after checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  android:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.buildAndroid
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_IDENTITY_API_URL: https://identity-api.bookmiz.com/api
      EXPO_PUBLIC_BOOKING_API_URL: https://booking-api.bookmiz.com/api
      EXPO_PUBLIC_WEB_APP_URL: https://www.bookmiz.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - run: npx expo prebuild --platform android --non-interactive
      - name: Build installable internal-test APK
        run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: BookMiz-Android-test-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
